name = "jsp_818_prime_primitive_roots"
defaultTargets = ["PrimePrimitiveRoot"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = "vendor"

[[lean_lib]]
name = "OAI"
srcDir = "vendor"

[[lean_lib]]
name = "PrimePrimitiveRoot"
roots = ["PrimePrimitiveRoot", "ElementaryFamilies", "DirichletGRH", "CharacterSieve",
  "SmoothedSums", "PrincipalMass", "ZeroKernel", "MellinKernel", "SizeBound",
  "BachZeros", "EulerBound", "GammaFactors", "ZeroMassBound", "GridFormula",
  "MomentUniqueness", "KernelBounds", "FiniteWitness", "FiniteReduction", "UnitMoments", "SpecialMoments",
  "ArithmeticMoments", "ZeroSide", "PoleMoments", "TrivialTail", "FirstPole", "ExplicitTwist"]
